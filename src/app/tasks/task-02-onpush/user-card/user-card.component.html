<section class="profile-panel" aria-label="Teammitglied">
  <div class="person-row">
    <span class="avatar" aria-hidden="true">AM</span>
    <div>
      <span class="label">Teammitglied</span>
      <h3>{{ user().name }}</h3>
    </div>
  </div>
  <div class="role-row">
    <span>Rolle</span>
    <strong data-testid="role">{{ user().role }}</strong>
  </div>
  <button
    class="secondary-button"
    type="button"
    data-testid="reset"
    (click)="resetRequested.emit()"
  >
    Zurücksetzen
  </button>
</section>
