<article class="demo-card filter-card">
  <div class="demo-card-heading">
    <div>
      <span class="demo-kicker">Team-Board</span>
      <h3>Lieferaufgaben</h3>
    </div>
    <span class="count-pill" data-testid="visible-count">
      {{ filteredTasks().length }} angezeigt
    </span>
  </div>
  <div class="segmented-control" aria-label="Aufgaben filtern">
    @for (option of filterOptions; track option) {
      <button
        type="button"
        [class.active]="filter() === option"
        [attr.data-testid]="'filter-' + option"
        (click)="setFilter(option)"
      >
        {{ filterLabels[option] }}
      </button>
    }
  </div>
  <ul class="task-list" data-testid="filtered-list">
    @for (task of filteredTasks(); track task.id) {
      <li class="filter-row">
        <span aria-hidden="true">{{ task.done ? '✓' : '○' }}</span
        ><span>{{ task.title }}</span>
      </li>
    }
  </ul>
  <div class="demo-actions">
    <button class="secondary-button" type="button" data-testid="add-open" (click)="addOpenTask()">
      Offene Aufgabe hinzufügen
    </button>
    <button class="secondary-button" type="button" data-testid="reset" (click)="reset()">
      Zurücksetzen
    </button>
  </div>
</article>
