<article class="demo-card people-dashboard">
  <div class="demo-card-heading">
    <div>
      <span class="demo-kicker">Projektteam</span>
      <h3>Team-Dashboard</h3>
    </div>
    <strong class="count-pill" data-testid="active-count">{{ activeUsers().length }} aktiv</strong>
  </div>
  @if (loading()) {
    <div class="loading-row" data-testid="loading">Team wird geladen…</div>
  } @else {
    <label class="search-field">
      <span>Aktives Teammitglied finden</span>
      <input
        #search
        data-testid="search"
        type="search"
        [value]="searchTerm()"
        (input)="updateSearch(search.value)"
        placeholder="Nach Name suchen"
      />
    </label>
    <div class="people-layout">
      <div class="people-list" data-testid="user-list">
        @for (user of visibleUsers(); track user.id) {
          <button
            type="button"
            [class.selected]="selectedUser()?.id === user.id"
            [attr.data-testid]="'user-' + user.id"
            (click)="select(user)"
          >
            <span class="avatar" aria-hidden="true">
              {{ user.name[0] }}{{ user.name.split(' ')[1][0] }}
            </span>
            <span
              ><strong>{{ user.name }}</strong
              ><small>{{ user.role }}</small></span
            >
          </button>
        } @empty {
          <p class="empty-state">Keine aktiven Teammitglieder gefunden.</p>
        }
      </div>
      @if (selectedUser(); as selected) {
        <app-user-details
          [user]="selected"
          [activeCount]="activeUsers().length"
          (statusChange)="toggleUserStatus($event)"
        />
      }
    </div>
  }
</article>
