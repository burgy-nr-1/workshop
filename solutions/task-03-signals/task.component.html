<article class="demo-card notification-card">
  <div class="demo-kicker">Posteingang-Simulator</div>
  <div class="counter-display">
    <span class="label">Ungelesene Benachrichtigungen</span>
    <strong data-testid="count">{{ count() }}</strong>
  </div>
  <p>Nach jeder Anforderung trifft asynchron eine Nachricht ein.</p>
  <div class="demo-actions">
    <button
      class="primary-button"
      type="button"
      data-testid="increment"
      (click)="receiveNotification()"
    >
      Benachrichtigung empfangen
    </button>
    <button class="secondary-button" type="button" data-testid="reset" (click)="reset()">
      Zurücksetzen
    </button>
  </div>
</article>
